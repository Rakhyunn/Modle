spring:
  datasource:
    url: jdbc:mysql://localhost:3306/modle?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD}

  cloud:
    gcp:
      storage:
        enabled: true

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: ${JWT_SECRET}

gcs:
  bucket: ${GCS_BUCKET_NAME:local-dummy}

cookie:
  secure: true
  domain: localhost
  same-site: Strict