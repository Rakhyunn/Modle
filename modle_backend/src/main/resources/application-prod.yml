spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

cookie:
  secure: true
  # 프론트엔드가 Next.js BFF 프록시(rewrite)를 통해 백엔드를 호출하므로, 인증 쿠키는
  # 프론트엔드 도메인의 first-party 쿠키로 저장된다. 따라서 Domain 속성은 비워(미설정) 둔다.
  # (Domain을 백엔드 도메인으로 지정하면 브라우저가 프록시 응답의 Set-Cookie를 거부한다.)
  # 배포 환경에서 COOKIE_DOMAIN 환경변수는 설정하지 말 것(비워두기).
  domain: ${COOKIE_DOMAIN:}
  # first-party이므로 cross-site용 None 대신 Lax 사용(동일 출처 요청에서 정상 전송, CSRF 방어 강화).
  same-site: Lax

logging:
  level:
    root: WARN
    com.modle: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN